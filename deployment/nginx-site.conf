# Main site expsolution.io -> frontend container
server {
  listen 80;
  server_name expsolution.io www.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  real_ip_header CF-Connecting-IP;

  location = /health { 
    return 200; 
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;   # original scheme at Cloudflare
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_pass http://exp-frontend:80;
  }
}

# Main API api.expsolution.io -> backend container
server {
  listen 80;
  server_name api.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  real_ip_header CF-Connecting-IP;

  location = /health { 
    return 200; 
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    # WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_pass http://exp-backend:8000;
  }

  # Health check endpoint
  location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
  }
}

# Event frontend event.expsolution.io -> event-frontend container
server {
  listen 80;
  server_name event.expsolution.io www.event.expsolution.io;
  
  # Basic settings
  client_max_body_size 10M;
  client_body_timeout 60s;
  client_header_timeout 60s;
  keepalive_timeout 65s;
  send_timeout 60s;
  
  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  real_ip_header CF-Connecting-IP;
  
  # Health check
  location = /health {
    return 200 'event-frontend-healthy\n';
    add_header Content-Type text/plain;
  }
  
  # Proxy to event frontend
  location / {
    proxy_pass http://event-frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
  }
}

# Event API apievent.expsolution.io -> event-backend container
upstream event_api_upstream {
  server event-backend:5008;
  keepalive 64;
}

server {
  listen 80;
  server_name apievent.expsolution.io www.apievent.expsolution.io;

  # Security & real IP
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  real_ip_header CF-Connecting-IP;

  client_max_body_size 10M;
  client_body_timeout 60s;
  client_header_timeout 60s;
  keepalive_timeout 65s;
  send_timeout 60s;

  # Health (proxy thẳng về backend /health)
  location = /health {
    proxy_pass http://event_api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
  }

  # API prefix (backend mount ở /api)
  location /api/ {
    proxy_pass http://event_api_upstream;   # giữ nguyên path
    proxy_http_version 1.1;

    # WebSocket và keepalive
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Forward headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Timeouts
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    proxy_buffering off;
  }

  # Nếu backend phục vụ static/media (nhiều API không cần, bỏ nếu không dùng)
  location /static/ {
    proxy_pass http://event_api_upstream/static/;
    proxy_set_header Host $host;
  }
  location /media/ {
    proxy_pass http://event_api_upstream/media/;
    proxy_set_header Host $host;
  }

  # Docs (FastAPI/Swagger)
  location /docs {
    proxy_pass http://event_api_upstream/docs;
    proxy_set_header Host $host;
  }
  location /redoc {
    proxy_pass http://event_api_upstream/redoc;
    proxy_set_header Host $host;
  }

  # Fallback: nếu backend ở root (không dùng /api), thì thay /api/ bằng /
  # location / { proxy_pass http://event_api_upstream; ... }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
