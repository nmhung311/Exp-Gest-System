# Event Services for External Nginx
# These containers will be accessible via your main nginx configuration

services:
  event-frontend:
    container_name: event-frontend
    build: 
      context: ../frontend
      dockerfile: Dockerfile
      target: runner
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=https://apievent.expsolution.io
      - NEXT_PUBLIC_FRONTEND_URL=https://event.expsolution.io
    expose:
      - "3000"
    depends_on:
      - event-backend
    networks:
      - exp-tech-nexus_exp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  event-backend:
    container_name: event-backend
    build: 
      context: ../backend
      dockerfile: Dockerfile
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5008
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=https://event.expsolution.io,https://www.event.expsolution.io,http://event.expsolution.io,http://www.event.expsolution.io
    expose:
      - "5008"
    networks:
      - exp-tech-nexus_exp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5008/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1.5G
          cpus: '0.6'
        reservations:
          memory: 512M
          cpus: '0.3'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    volumes:
      - backend_logs:/app/logs
      - backend_backups:/app/backups
      - backend_data:/app/instance
      - ../backend/exp_guest.db:/app/exp_guest.db

networks:
  exp-tech-nexus_exp-network:
    external: true

volumes:
  backend_logs:
    driver: local
  backend_backups:
    driver: local
  backend_data:
    driver: local