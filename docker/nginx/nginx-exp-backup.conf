# Front expsolution.io -> frontend container
server {
  listen 80;
  server_name expsolution.io www.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  real_ip_header CF-Connecting-IP;

  location = /health { return 200; }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;   # original scheme at Cloudflare
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_pass http://exp-frontend:80;
  }
}

# Front api.expsolution.io -> backend container
server {
  listen 80;
  server_name api.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  real_ip_header CF-Connecting-IP;

  location = /health { return 200; }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;

    # WebSockets
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_pass http://exp-gest-system-backend-1:5008;
  }

  # Health check endpoint
  location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}
