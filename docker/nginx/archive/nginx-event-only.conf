# Nginx configuration for event.expsolution.io only
# Site gốc expsolution.io chạy riêng biệt và không được động chạm

# HTTP -> HTTPS + apex
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;
    return 301 https://expsolution.io$request_uri;
}

