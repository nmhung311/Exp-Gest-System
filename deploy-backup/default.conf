# UNIFIED NGINX CONFIGURATION FOR ALL 3 WEBSITES
# Handles: expsolution.io, event.expsolution.io, api.expsolution.io

# Upstream Definitions
upstream exp_frontend {
    server 172.19.0.3:80;  # EXP Technology Frontend
    keepalive 32;
}

upstream exp_backend {
    server 172.19.0.4:8000;  # EXP Technology Backend
    keepalive 32;
}

upstream gest_frontend {
    server 172.20.0.3:3000;  # Event Management Frontend
    keepalive 32;
}

upstream gest_backend {
    server 172.20.0.2:5008;  # Event Management Backend
    keepalive 32;
}

# Rate Limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/s;

# ===============================================
# MAIN WEBSITE: expsolution.io
# ===============================================
server {
    listen 80;
    server_name expsolution.io www.expsolution.io;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' ws: wss: https://api.expsolution.io http://api.expsolution.io; frame-src 'self';" always;

    # CORS headers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Main frontend for EXP Technology
    location / {
        proxy_pass http://exp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Cache settings
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static files optimization
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff|woff2|ttf|eot|webp|avif|map)$ {
        proxy_pass http://exp_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache headers
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API endpoints for EXP Technology (internal)
    location /internal-api/ {
        proxy_pass http://exp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        limit_req zone=api burst=20 nodelay;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check
    location /health {
        return 200 "EXP Technology - Main site healthy\n";
        add_header Content-Type text/plain;
    }
}

# ===============================================
# EVENT MANAGEMENT SYSTEM: event.expsolution.io
# ===============================================
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # API endpoints to Event Management Backend
    location /api/ {
        proxy_pass http://gest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # Rate limiting
        limit_req zone=api burst=10 nodelay;

        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }

    # Main frontend for Event Management
    location / {
        proxy_pass http://gest_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }

    # Health check
    location /health {
        return 200 "Event Management System - healthy subdomain\n";
        add_header Content-Type text/plain;
    }
}

# ===============================================
# API SUBDOMAIN: api.expsolution.io
# ===============================================
server {
    listen 80;
    server_name api.expsolution.io www.api.expsolution.io;

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Robots-Tag "noindex, nofollow";

    # CORS headers cho Cloudflare Workers
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, CF-Worker" always;
    add_header Access-Control-Max-Age "86400" always;

    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;

    # Preflight OPTIONS requests
    location ~* \.(OPTIONS)$ {
        return 200 "OK";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, CF-Worker";
        add_header Access-Control-Max-Age "86400";
        add_header Content-Length 0;
    }

    # Specific auth endpoints (v1 prefix)
    location ~ ^/api/v1/auth/(login|register|refresh)$ {
        proxy_pass http://gest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Rate limiting for login
        limit_req zone=login burst=5 nodelay;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # General API endpoints
    location /api/ {
        proxy_pass http://gest_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Rate limiting
        limit_req zone=api burst=10 nodelay;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check
    location /health {
        return 200 "API subdomain operational - auth endpoints available\n";
        add_header Content-Type text/plain;
    }

    # Status endpoint
    location /status {
        return 200 "api.expsolution.io: controlled access enabled\n";
        add_header Content-Type text/plain;
    }

    # Block everything else
    location / {
        return 403 "API endpoint not permitted\n";
        add_header Content-Type text/plain;
    }
}

# ===============================================
# DEFAULT SERVER (catch-all)
# ===============================================
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
