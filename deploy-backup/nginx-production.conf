# Main DOMAIN: expsolution.io -> exp-frontend (site chính)
server {
  listen 80;
  server_name expsolution.io www.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  real_ip_header CF-Connecting-IP;

  # Health check endpoint
  location = /health {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  # Proxy vào site chính từ exp-tech-nexus (giữ nguyên)
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_pass http://exp-frontend:80;
  }
}

# API DOMAIN: api.expsolution.io -> exp-backend (giữ nguyên)
server {
  listen 80;
  server_name api.expsolution.io;

  add_header X-Content-Type-Options nosniff;
  real_ip_header CF-Connecting-IP;

  # Health check endpoint
  location = /health {
    return 200 'OK';
    add_header Content-Type text/plain;
  }

  # Proxy vào API từ exp-tech-nexus (giữ nguyên)
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_pass http://exp-backend:8000;
  }
}

# EVENT SUBDOMAIN: event.expsolution.io -> YOUR PROJECT
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;
    
    # Basic settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 🚫 CHẶN REDIRECT - Không redirect homepage nữa
    # Homepage sẽ được serve như các trang khác
    
    # Backend API routes (YOUR PROJECT)
    location /api/ {
        proxy_pass http://frontend:3000;  # Frontend của bạn handle API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend routes (ALL paths serve từ YOUR frontend)
    location / {
        proxy_pass http://frontend:3000;  # YOUR frontend project
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "event-subdomain-healthy\n";
        add_header Content-Type text/plain;
    }
}
