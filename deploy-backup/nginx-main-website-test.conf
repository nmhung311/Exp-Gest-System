# SIMPLE CONFIG CHỈ ĐỂ TEST MAIN WEBSITE

upstream main_frontend {
    server exp-frontend:80;
    keepalive 32;
}

# MAIN DOMAIN: expsolution.io -> MAIN WEBSITE
server {
    listen 80;
    server_name expsolution.io www.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    real_ip_header CF-Connecting-IP;

    # Health check
    location = /health {
        return 200 'main-website-test\n';
        add_header Content-Type text/plain;
    }

    # Proxy đến MAIN WEBSITE
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_pass http://main_frontend;
    }
}

# DEFAULT SERVER - Serve event website for other domains
server {
    listen 80 default_server;
    server_name _;
    
    return 200 "Currently serving only expsolution.io - event subdomain config needed\n";
    add_header Content-Type text/plain;
}
