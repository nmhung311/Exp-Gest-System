# COMPLETE HYBRID NGINX CONFIG
# Serve cả MAIN WEBSITE và EVENT SERVICES correctly

upstream main_frontend {
    server exp-frontend:80;
    keepalive 32;
}

upstream main_backend {
    server exp-backend:8000;
    keepalive 32;
}

upstream event_frontend {
    server exp-gest-system-frontend-1:3000;
    keepalive 32;
}

upstream event_backend {
    server exp-gest-system-backend-1:5008;
    keepalive 32;
}

# MAIN DOMAIN: expsolution.io -> MAIN WEBSITE  
server {
    listen 80;
    server_name expsolution.io www.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    real_ip_header CF-Connecting-IP;

    # Health check
    location = /health {
        return 200 'main-website-healthy\n';
        add_header Content-Type text/plain;
    }

    # Proxy đến MAIN WEBSITE (correct content)
    location / {
        proxy_pass http://main_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}

# MAIN API: api.expsolution.io -> MAIN API DOCUMENTATION
server {
    listen 80;
    server_name api.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    real_ip_header CF-Connecting-IP;

    # Health check
    location = /health {
        return 200 'main-api-healthy\n';
        add_header Content-Type text/plain;
    }

    # Proxy đến MAIN API (Swagger/OpenAPI documentation)
    location / {
        proxy_pass http://main_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}

# EVENT FRONTEND: event.expsolution.io -> YOUR EVENT FRONTEND
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;
    
    # Basic settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    real_ip_header CF-Connecting-IP;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "event-frontend-healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend routes (serve Next.js app from event frontend)
    location / {
        proxy_pass http://event_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Robust timeout settings để tránh 502/512/521
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings để tránh incomplete responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Retry logic robust
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
        
        # Prevent caching issues
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
    }
}

# EVENT API: apievent.expsolution.io -> YOUR EVENT BACKEND  
server {
    listen 80;
    server_name apievent.expsolution.io www.apievent.expsolution.io;
    
    # Basic settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    real_ip_header CF-Connecting-IP;
    
    # Health check endpoint để monitor
    location = /health {
        access_log off;
        return 200 "event-api-healthy\n";
        add_header Content-Type text/plain;
    }

    # Backend API routes với robust settings
    location / {
        proxy_pass http://event_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Robust timeout settings để tránh 502/512/521
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings để tránh incomplete responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Retry logic robust
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 30s;
        
        # CORS headers preflight
        if ($request_method = "OPTIONS") {
            add_header Access-Control-Allow-Origin "https://event.expsolution.io";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type text/plain;
            add_header Content-Length  ͫ0;
            return 204;
        }
        
        # Add CORS headers for actual requests
        add_header Access-Control-Allow-Origin "https://event.expsolution.io" always;
        add_header Access-Control-Allow-Credentials true always;
    }
}
