upstream event_frontend {
    server exp-gest-system-frontend-1:3000;
    keepalive 32;
}

upstream backend {
    server exp-gest-system-backend-1:5008;
    keepalive 32;
}

# EVENT SUBDOMAIN: event.expsolution.io -> event site phụ
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;
    
    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    
    # Redirect được xử lý bởi Next.js middleware
    # Không redirect ở Nginx để tránh conflict
    
    # Backend API routes
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    
    # Frontend routes (all other paths)
    location / {
        proxy_pass http://event_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Default server block to handle other domains
server {
    listen 80 default_server;
    server_name _;
    return 444; # Close connection without response
}
