# PRODUCTION NGINX CONFIG - PORT 80
# Serve both main domain và event subdomain

upstream your_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream your_backend {
    server backend:5008;
    keepalive 32;
}

upstream main_frontend {
    server exp-frontend:80;
    keepalive 32;
}

# MAIN DOMAIN: expsolution.io (giữ nguyên như cũ)
server {
    listen 80;
    server_name expsolution.io www.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    real_ip_header CF-Connecting-IP;

    # Health check
    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy đến main site (container khác)
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_pass http://main_frontend;
    }
}

# API DOMAIN: api.expsolution.io (giữ nguyên)
server {
    listen 80;
    server_name api.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    real_ip_header CF-Connecting-IP;

    location = /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy đến API backend (container khác)
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_pass http://exp-backend:8000;
    }
}

# EVENT SUBDOMAIN: event.expsolution.io -> YOUR PROJECT
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;
    
    # Basic settings
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    real_ip_header CF-Connecting-IP;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Health check for monitoring
    location = /health {
        return 200 "event-subdomain-healthy\n";
        add_header Content-Type text/plain;
    }

    # Backend API routes (YOUR PROJECT)
    location /api/ {
        proxy_pass http://your_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Frontend routes (ALL paths serve từ YOUR frontend)
    location / {
        proxy_pass http://your_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings - tăng timeout để tránh 502/512
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;
        
        # Cache bypass for dynamic content
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # Retry settings
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }
}
