# CENTRAL NGINX PROXY CONFIG
# Serves all domains through single proxy with SSL termination at Cloudflare

# WebSocket mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Main website upstreams
upstream main_frontend {
    server exp-frontend:80;
    keepalive 32;
}

upstream main_backend {
    server exp-backend:8000;
    keepalive 32;
}

# Event website upstreams
upstream event_frontend {
    server event-frontend:3000;
    keepalive 32;
}

upstream event_backend {
    server event-backend:5008;
    keepalive 32;
}

# MAIN WEBSITE: expsolution.io -> MAIN WEBSITE  
server {
    listen 80;
    server_name expsolution.io www.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    real_ip_header CF-Connecting-IP;

    location = /health { 
        access_log off;
        return 200 'main-website-healthy\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://main_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;   # Cloudflare proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# MAIN API: api.expsolution.io -> MAIN API DOCUMENTATION
server {
    listen 80;
    server_name api.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    real_ip_header CF-Connecting-IP;

    location = /health { 
        access_log off;
        return 200 'main-api-healthy\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://main_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

# EVENT FRONTEND: event.expsolution.io -> EVENT FRONTEND
server {
    listen 80;
    server_name event.expsolution.io www.event.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    real_ip_header CF-Connecting-IP;

    location = /health { 
        access_log off;
        return 200 'event-frontend-healthy\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://event_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;   # Cloudflare proxy
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        
        # WebSocket support for Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        
        # Robust settings for stability
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}

# EVENT API: apievent.expsolution.io -> EVENT BACKEND
server {
    listen 80;
    server_name apievent.expsolution.io www.apievent.expsolution.io;

    add_header X-Content-Type-Options nosniff;
    real_ip_header CF-Connecting-IP;

    location = /health { 
        access_log off;
        return 200 'event-api-healthy\n';
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://event_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;

        # WebSockets support (if backend uses)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        
        # CORS headers for frontend calls
        add_header Access-Control-Allow-Origin "https://event.expsolution.io" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        
        if ($request_method = "OPTIONS") {
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        
        # Robust settings for stability
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
